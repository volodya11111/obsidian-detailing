<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSIDIAN ATELIER — Вход в реестр управления</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e5a93c'/><text x='50%' y='65%' font-family='sans-serif' font-size='55' font-weight='900' fill='%23000' text-anchor='middle'>O</text></svg>">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 40px var(--accent-glow);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 42px 36px;
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold-dark));
      border-radius: 14px;
      color: #000;
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: 0 0 25px var(--accent-glow);
      margin-bottom: 16px;
    }
    .login-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .login-alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      margin-bottom: 22px;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .login-btn {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      font-size: 0.95rem;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-subtle);
      transition: var(--transition);
    }
    .back-home:hover {
      color: var(--accent-gold);
    }
  </style>
</head>
<body>
  <div class="bg-grid-overlay"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">O</div>
        <h1 class="login-title">OBSIDIAN <span>CONTROL</span></h1>
        <div class="login-sub">Закрытый терминал управления</div>
      </div>

      <div id="login-alert" class="login-alert">
        <span>⚠️</span>
        <span id="alert-text">Неверный логин или пароль</span>
      </div>

      <form id="login-form">
        <div class="form-field">
          <label class="form-label" for="username">Идентификатор (Логин)</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            required 
            autocomplete="username" 
            placeholder="Введите логин"
            autofocus
          >
        </div>

        <div class="form-field">
          <label class="form-label" for="password">Ключ доступа (Пароль)</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            required 
            autocomplete="current-password" 
            placeholder="Введите пароль"
          >
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary login-btn">
          <span>Войти в реестр</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <a href="/" class="back-home">← Вернуться на главный сайт</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('alert-text');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Проверка доступа...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          submitBtn.innerHTML = 'Доступ подтвержден ✓';
          window.location.href = '/admin';
        } else {
          alertText.textContent = data.error || 'Неверный логин или пароль';
          alertBox.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Войти в реестр</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
        }
      } catch (err) {
        alertText.textContent = 'Ошибка связи с сервером';
        alertBox.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Войти в реестр</span>';
      }
    });
  </script>
</body>
</html>
